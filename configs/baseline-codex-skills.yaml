# Baseline with GPT 5.4 + SDK skills — no MCP servers
configs:
  - name: baseline-skills/gpt-5.4
    description: "Baseline + Skills — GPT 5.4 with SDK plugin skills"
    generator:
      model: "gpt-5.4"
      tools:
        - name: generator-skills
          type: skill
          source: local
          skill_dir: true
          path: "./skills/generator"
    reviewer:
      models:
        - "claude-sonnet-4.5"
        - "gemini-3-pro-preview"
      tools:
        - name: reviewer-skills
          type: skill
          source: local
          skill_dir: true
          path: "./skills/reviewer"
    plugins:
      - "azure-sdk-java@skills"
      - "azure-sdk-python@skills"
      - "azure-sdk-dotnet@skills"
      - "azure-sdk-typescript@skills"
      - "azure-sdk-rust@skills"
