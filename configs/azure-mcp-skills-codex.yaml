# Azure MCP with GPT 5.4 + SDK skills — Azure MCP server attached
configs:
  - name: azure-mcp-skills/gpt-5.4
    description: "Azure MCP + Skills — GPT 5.4"
    generator:
      model: "gpt-5.4"
      tools:
        - name: azure
          type: mcp
          command: npx
          args: ["-y", "@azure/mcp@latest", "server", "start"]
          mcp_tools: ["*"]
        - name: generator-skills
          type: skill
          source: local
          skill_dir: true
          path: "./skills/generator"
    reviewer:
      models:
        - "claude-sonnet-4.5"
        - "gemini-3-pro-preview"
      tools:
        - name: reviewer-skills
          type: skill
          source: local
          skill_dir: true
          path: "./skills/reviewer"
    plugins:
      - "azure-sdk-java@skills"
      - "azure-sdk-python@skills"
      - "azure-sdk-dotnet@skills"
      - "azure-sdk-typescript@skills"
      - "azure-sdk-rust@skills"
