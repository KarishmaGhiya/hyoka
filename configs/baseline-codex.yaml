# Baseline with GPT 5.4 — no MCP servers, no skills
configs:
  - name: baseline/gpt-5.4
    description: "Baseline — raw Copilot with GPT 5.4"
    generator:
      model: "gpt-5.4"
    reviewer:
      models:
        - "claude-opus-4.6"
        - "gemini-3-pro-preview"
        - "gpt-4.1"
      tools:
        - name: reviewer-skills
          type: skill
          source: local
          skill_dir: true
          path: "./skills/reviewer"
