# Azure MCP with GPT 5.4 — Azure MCP server attached
configs:
  - name: azure-mcp/gpt-5.4
    description: "Azure MCP — GPT 5.4"
    generator:
      model: "gpt-5.4"
      tools:
        - name: azure
          type: mcp
          command: npx
          args: ["-y", "@azure/mcp@latest", "server", "start"]
          mcp_tools: ["*"]
    reviewer:
      models:
        - "claude-opus-4.6"
        - "gemini-3-pro-preview"
        - "gpt-4.1"
      tools:
        - name: reviewer-skills
          type: skill
          source: local
          skill_dir: true
          path: "./skills/reviewer"
