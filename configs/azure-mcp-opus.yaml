# Azure MCP with Claude Opus 4.6 — Azure MCP server attached
configs:
  - name: azure-mcp/claude-opus-4.6
    description: "Azure MCP — Claude Opus 4.6"
    generator:
      model: "claude-opus-4.6"
      tools:
        - name: azure
          type: mcp
          command: npx
          args: ["-y", "@azure/mcp@latest", "server", "start"]
          mcp_tools: ["*"]
    reviewer:
      models:
        - "claude-sonnet-4.5"
        - "gemini-3-pro"
      tools:
        - name: reviewer-skills
          type: skill
          source: local
          skill_dir: true
          path: "./skills/reviewer"
    limits:
      max_turns: 75
